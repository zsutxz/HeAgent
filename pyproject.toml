[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heagent"
version = "0.7.0"
description = "A self-improving AI Agent core framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "HeAgent Contributors" },
]
requires-python = ">=3.11"
keywords = ["ai", "agent", "llm", "self-learning", "mcp", "tool-calling", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "openai>=2.37",
    "anthropic>=0.104",
    "click>=8.0",
    "mcp>=1.29.1,<2",
]

[project.urls]
Homepage = "https://github.com/zsutxz/HeAgent"
Repository = "https://github.com/zsutxz/HeAgent"
Issues = "https://github.com/zsutxz/HeAgent/issues"
Documentation = "https://github.com/zsutxz/HeAgent/blob/main/docs/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.16.6,<0.17",
    "mypy>=2.3.1,<2.4",
    "pre-commit",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest-benchmark>=4.0",
]
gui = [
    "textual>=1.0,<2.0",
]

# HTTP 网页入口（Epic 49）的可选依赖：**直接声明**，不依赖 mcp 的传递依赖（AD-11）。
# 缺依赖时 `heagent http-server` 与默认 CLI 的自动启动都会给出安装诊断；
# 基础安装、库用法与其它子命令不需要它们。
http = [
    "starlette>=1.3.1,<1.4",
    "uvicorn>=0.50.1,<0.51",
]

[project.scripts]
heagent = "heagent.cli.console:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 默认排除 integration + benchmark（真实外部依赖 / 性能基准不进全绿基线）
# 显式运行：pytest -m integration / pytest -m benchmark
addopts = ["-m", "not integration and not benchmark"]
markers = [
    "no_auto_workspace: do not auto-set workspace root in path safety tests",
    "integration: 真实外部依赖 E2E（需凭据/网络，默认不进基线；显式 `pytest -m integration` 运行）",
    "benchmark: 性能基准测试（默认跳过，手动 `pytest -m benchmark` 运行）",
    "embedded_http_service: 用真实 HTTP 服务与随机端口（退出 conftest 的默认替身；Epic 49）",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heagent"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "heagent.pub.persist",
    "heagent.tools.sandbox",
]
disallow_untyped_defs = false

# ── Coverage (pytest-cov) ──
# branch = true 启用分支覆盖，更诚实（此前 90% 为纯行覆盖）
[tool.coverage.run]
source = ["src/heagent"]
branch = true
omit = [
    "tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    # GUI（Textual TUI）与 CLI 交互层不做单元测试：gui 依赖可选组 textual
    # （dev 组不含、CI 不安装，tests/ 无覆盖）；CLI 入口 / 终端键盘监听 /
    # 显示层以人工与 E2E 验证为主。排除后默认回归覆盖率约 89%（门限 87%）。
    "*/gui/*",
    # CLI 入口层（`heagent/cli/` 包）：控制台命令层 / 交互执行层（REPL + 斜杠命令族）/ goal 命令族 /
    # 展示层以人工与 E2E 验证为主，不计入覆盖率。
    # 口径随模块走——`cli/composition.py`（装配）、`cli/init.py`、`cli/http.py`、`cli/http_console.py`、
    # `cli/tcp.py`、`cli/dialogs.py` **不** omit。
    "*/cli/console.py",
    "*/cli/interactive.py",
    "*/cli/goal.py",
    "*/cli/display.py",
    "*/cli/terminal.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# 分支覆盖基线 87%；CI 经 --cov-fail-under 读取同一门限
fail_under = 87

# ── Benchmark (pytest-benchmark) ──
[tool.pytest_benchmark]
min_rounds = 5
max_time = 1.0
timer = "time.perf_counter"
storage = "./benchmark-data/"
save = "ci"
autosave = true
