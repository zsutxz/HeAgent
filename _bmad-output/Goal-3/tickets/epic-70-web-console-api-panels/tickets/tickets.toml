description = "网页端新增开发者面板（设置区入口 + #api 直达）：方法 + 路径 + 可选 JSON body → 同源 fetch → 展示状态码、耗时与响应 JSON（textContent）；预置端点清单与后端路由表对齐；写方法（POST/PATCH/PUT/DELETE）需二次确认，`?confirm=true` 类闸门在提示中说明；不引入第三方库、不发跨源请求、不放宽 CSP。"
