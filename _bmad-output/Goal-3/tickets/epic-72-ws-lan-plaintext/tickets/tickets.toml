[[entry]]
id = 4
type = "story"
title = "安全口径 canonical 与派生副本同步"
description = "口径改写（唯一真源 + 派生 + 守卫三者同批）：`docs/frame.md` §4.19 要素 4 从「非回环强制 Bearer、缺 token 拒绝启动」改成双档表述——`external`（非回环且未开 `WS_LAN_NO_AUTH`）仍强制 Bearer 且 fail-closed；`lan`（非回环 + 私有地址字面量 + 显式 `WS_LAN_NO_AUTH=true`）**无认证、无 TLS**，每次启动一条 WARNING，身份是内网调试入口、不得映射公网。要素 3 补「`lan` 绑定不等于可信、同网段任何设备可驱使代理」。要素 5 端点可见性改口径（`/api/cli/ws` 只挂 `local`；`/api/notifications/ws` 在 `local` 与 `lan` 都随中枢注册；对外 listener 概念退役）。§4.17.1 删「双监听并存」行与 `WS_EXTERNAL_*` 键表、监听模式行加 `lan`、`WS_EXTERNAL_READONLY` 行删除；§4.17 的「Epic 56 起该服务 = 双 server / 期二再加一条」段与命令行 help 文案同步。派生副本 `AGENTS.md`「⚠️ 安全声明」要素 3/4/5 与 `CLAUDE.md`「安全口径」同批改写（措辞可不同、要素不增不删）。`tests/test_security_posture_contract.py` 的 `FRAME_ELEMENT_PHRASES` / `AGENTS_ELEMENT_PHRASES` 更新短语集（保留正向包含风格：`WS_LAN_NO_AUTH`、`内网调试入口`、`fail-closed`），谓词分组去掉 `ws_external_*`、把 `ws_lan_no_auth` 归入「安全侧 = False」的 documented-bool（默认关才是安全侧）。`docs/tls-connect-guide.md` 定稿：状态行改「第一步已实施（服务端部分）」、服务端小节指向新键、附录 A 标题保留但注明 `9301` 已退役；`mkdocs.yml` nav 与 `docs/README.md` 索引登记该页（`--strict` 要求）。"
