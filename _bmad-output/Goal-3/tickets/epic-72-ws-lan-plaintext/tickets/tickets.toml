[[entry]]
id = 3
type = "story"
title = "自检与排障面（doctor + 启动公告 + 排障指引）"
description = "把 `lan` 组合的可错点做成启动前可见。`cli/doctor.py` 增三条：`doctor.ws_lan_without_flag`（`WS_HOST` 非回环且非私有地址、`WS_LAN_NO_AUTH` 未开 ⇒ ERROR，指出「会被强制 token 或拒绝启动」）、`doctor.ws_lan_host_not_private`（开了开关但 host 是通配/公网/主机名 ⇒ ERROR + 改法「填本机私有 IPv4，用 `ipconfig` / `ip -4 addr` 查」）、`doctor.ws_lan_auth_conflict`（与 `WS_LOCAL_AUTH_ENABLED=true` 同开 ⇒ ERROR）；已有的 `doctor.ws_main_external_without_token` 文案改成区分「未开 `WS_LAN_NO_AUTH`」与「已开但地址不合规」两种原因。启动公告统一成 `mode` 三值（`listener=local|lan|external`，`lan` 额外带 `auth=none cron_push=…`），`cli/http.py` 与 `cli/http_config.py` 的公告点同批改；拒绝启动的错误文案点名键名 + 两个可选改法（`WS_LAN_NO_AUTH=true` 走内网免认证 / 填 `WS_AUTH_TOKEN` 走对外）。`scripts/ws_manual_probe.py` 顶部用例补一条内网明文示例（`ws://192.168.2.226:9201 ping`，无 token）与「`--token` 只对 `external` 需要」的说明；`docs/faq.md` 与 `docs/errors.md` 的 WS 排障条目把 `9301` / `WS_EXTERNAL_*` 处置改写成 `10061`（未绑该地址）与 `403`（仍在校验 token / host 不在白名单）两条新判据。"
verify = "① 四条 doctor 场景各一条用例：合法 `lan` 组合零 ERROR finding、缺开关/地址不合规/与 `WS_LOCAL_AUTH_ENABLED` 冲突各产出一条 ERROR 且 `code` 与 message 点名键名；② 退役键残留夹具只产 INFO（不阻断启动），已有 `test_cli_doctor.py` 的退出码语义不变；③ 启动公告断言按 `mode` 三值参数化（`local` / `lan` / `external` 各一条，`lan` 那条含 `auth=none`），且 `caplog` 计数恰为一次；④ 拒绝启动的 `CliRunner` 输出含 `WS_LAN_NO_AUTH` 与 `WS_AUTH_TOKEN` 两个改法、退出码 1、无 traceback；⑤ `scripts/ws_manual_probe.py --help` 与文件头示例含内网明文用法（静态断言即可，探针不真跑）；⑥ `docs/faq.md` / `docs/errors.md` 里 `9301` 零命中（改指 `WS_LAN_NO_AUTH`），`pytest tests/test_docs_links.py -q` 绿。"
