# 本 epic 的 entry，表顺序即构建顺序；id 永不复用。epic 72 为新能力 epic（非 v6 迁移），无 v6_key。
[[entry]]
id = 1
type = "story"
title = "局域网免认证监听模式（lan）"
description = "让「绑私有 IPv4 + 免 token」这个组合能起来，且是显式选择而非默认。`network/exposure.py` 新增 `is_private_address(host)`（`ipaddress` 判定：必须是 IP 字面量且 `is_private` 或 `is_link_local`；`0.0.0.0` / `::` / 公网地址 / 主机名一律 False，不解析 DNS）。`WsServerConfig` 新增 `lan_no_auth: bool = False`：`mode` 改成三值（回环 `local` / 非回环且 `lan_no_auth` 为 `lan` / 其余非回环 `external`），`requires_auth` 只在 `mode == \"external\"`（或回环 + `local_auth`）时为真，`_validate_auth_and_tls` 增三条 fail-loud：`lan_no_auth` + 回环地址、+ 非私有地址、+ `local_auth=True` 同时开。`build_ws_app` 的「防线替换」判据从 `config.requires_auth` 改成 `config.mode == \"external\"`（`lan` 保留 Host/Origin 校验：无 `Origin` 的客户端照放行，Host 必须等于绑定地址）；免认证时 `authorize=None` 与现状一致。`Settings` 加 `ws_lan_no_auth: bool = False`（env `WS_LAN_NO_AUTH`），`cli/http_config.build_ws_server_config` 接线；`build_ws_servers` 的旁路分支按 `mode == \"local\"` 判定（`lan` 也跳过并 WARNING，reason 文案改成 `reason=non_loopback_listener`，保留「为什么没有这条流」的可读性）。`http_protocol.ListenerMode` 加 `LAN = \"lan\"`，`cli/http_status` 的 listener 投影按新值输出。每次启动一条 WARNING（`ws event=exposed mode=lan auth=none host=… port=… cron_push=…`），位置在 listener 起来之后、只打一次。"
verify = "① 默认 `WS_HOST=127.0.0.1` 时 `mode == \"local\"`、`requires_auth` 为假、`/api/cli/ws` 照挂（既有用例保持绿，不改断言）；② `WS_HOST=192.168.2.226` 无开关 ⇒ `build_ws_server_config` 抛 `WsConfigError` 且消息含 `WS_LAN_NO_AUTH` 与「loopback」两个改法；③ 同 host + `WS_LAN_NO_AUTH=true` ⇒ 构造成功、`mode == \"lan\"`、`requires_auth` 为假；④ 四条非法组合各一条用例（`0.0.0.0` / `::` / `8.8.8.8` / `example.lan`）分别抛 `ValueError`（`WsServerConfig` 层）且 `WsConfigError`（装配层），消息点名键名；⑤ `lan` 模式下带 `Host: <bind>` 无 `Origin` 的真 TCP 握手拿到 `101`、无 `Authorization` 头；`Host: evil.example` 仍被拒（同一 listener 上两条断言，证明防线没被拆）；⑥ `WS_LAN_NO_AUTH=true` + `WS_LOCAL_AUTH_ENABLED=true` ⇒ 拒绝启动；⑦ `/api/status` 的 listeners 里该条 `mode == \"lan\"`；⑧ 启动日志恰有一条 `mode=lan auth=none` WARNING（用 `caplog` 数条数，不是「存在」）。"
covers = []
after = []
hitl = false
risk = "high"

