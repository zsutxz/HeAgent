title = "退役对外 listener 与 WS_EXTERNAL_* 配置族"
description = "按需求「`9301` 不再使用」，把第二条对外 listener 整族硬删除（无别名、无兼容层）。删除面清单：`Settings` 的 `ws_external_host` / `ws_external_port` / `ws_external_readonly` / `ws_external_tls_cert_file` / `ws_external_tls_key_file`；`cli/http_config.py` 的 `build_external_ws_server_config` 与 `_external_tls_files`，`build_ws_servers` 去掉 `external_host` / `external_port` / `external_readonly` 参数与「第二条 listener」装配分支（返回值形状仍是 `(servers, hub)`，只是恒 1 条）；`cli/http.py` 的三个 `--ws-external-*` 选项及其透传；`config/validation.py` 的 `_external_ws_host` / `_gate_ws_external_binding` / `_judge_ws_external_binding` 与 `_judge_ws_auth_token`、`_judge_ws_tls_pair` 里的对外分支（`REQUIRED_SETTING_KEYS` 同步删两项）；`cli/doctor.py` 的三条对外 findings 与端口候选里的 `WS_EXTERNAL_PORT`；`scripts/setup_ws_external.py` 与 `tests/test_setup_ws_external.py` 整体删除。**残留键可见性**：`doctor` 加一条 INFO finding——环境变量或项目 `.env` 里出现任一退役键（`WS_EXTERNAL_*`）且值非空时提示「已退役、被忽略，改 `WS_HOST` + `WS_LAN_NO_AUTH`」；`Settings` 的 `extra=\"ignore\"` 保持不动（老 `.env` 不炸）。`.env.example` 删 5 个键、加 `WS_LAN_NO_AUTH` 注释块；`CHANGELOG.md` 的 `## [Unreleased]` 写一条 `### Removed`（键与端口、迁移三条）。"
