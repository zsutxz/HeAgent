# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# HeAgent 团队固定配置（installer 永不覆盖；恢复 uninstall+reinstall 丢失的值）。
# base config.toml 同步写一份作即时生效；此处为 lasting 后盾，下次 install deep-merge。
[core]
project_name = "heagent"
output_folder = "{project-root}/_bmad-output"

# HeAgent 团队固定配置（续）——产物路径写成显式形式。
# 背景：BMad 渲染器 render_skill.py 只展开 {project-root}，不展开嵌套的 {output_folder}，
# 而 base config 里 planning_artifacts / implementation_artifacts 写作
# "{project-root}/{output_folder}/..."，于是渲染产物会残留字面量 {output_folder}。
# 这里直接给出等价的显式路径，使渲染结果不依赖渲染器的嵌套展开能力：
# 即使 .heagent/skills 之外的 vendored render_skill.py 在 BMad 升级时被覆盖，
# 渲染产物仍然正确。installer 永不覆盖本文件。
[modules.bmm]
planning_artifacts = "{project-root}/_bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/_bmad-output/implementation-artifacts"
