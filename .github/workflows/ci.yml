name: CI

on:
  push:
    branches: [master, feat/module-integration]
    tags: ["v*"]  # 推送 v0.3.1 等 tag 触发发布
  pull_request:
  workflow_dispatch:  # 手动触发（含 integration 测试 + 可选发布）

jobs:
  # ── Lint + Security job（单次运行，不随矩阵重复）──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # gui extra 必装：mypy 检查 src/heagent/gui/**，缺 textual 会报 import-not-found
        # http extra 必装：mypy 检查 src/heagent/network/http_server.py 与 cli/http.py，
        # 缺 starlette/uvicorn 同样会报 import-not-found（Epic 49）
        run: pip install -e ".[dev,gui,http]"

      - name: Ruff lint
        run: ruff check src tests scripts examples

      - name: Ruff format check
        run: ruff format --check src tests scripts examples

      - name: Mypy (strict)
        run: mypy src

      - name: Bandit (security scan)
        run: bandit -r src/ -ll

      - name: pip-audit (dependency vulns)
        # 审计输入是 `requirements.lock`（67.10 的参考锁定）而非当前环境：环境里本项目是
        # editable 安装，pip-audit 会把它算作「跳过项」，`--strict` 于是每次都以退出码 1 结束
        # （--skip-editable 也一样——--strict 把任何 skip 都判为 fatal）。锁文件是精确且可复现的
        # 输入，本地与 CI 因此得到**同一个判定**。`--strict` 的含义 = 依赖收集失败也判红，
        # 防止扫描器静默少扫；报告落 JSON 供 artifact 归档。
        run: pip-audit --strict -r requirements.lock --format json --output pip-audit.json

      - name: Upload pip-audit report
        # 失败也要留证据（`if: always()`）：没有报告时，红了的 run 只能靠日志里被截断的表格判断。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Contract snapshot (baselines unchanged)
        run: python scripts/contract_snapshot.py --check

      - name: Docs build (mkdocs --strict)
        # `mkdocs` 不在依赖树里（构建期工具而非库依赖），按需装；`--strict` 的真正含义是
        # 「validation 里未 ignore 的告警一律 fail」——报告的一类口径见 `mkdocs.yml` 注释。
        run: |
          pip install mkdocs
          mkdocs build --strict

  # ── 测试矩阵（多平台 × 多 Python 版本）──
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14-dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,http]"

      - name: Test
        # 3.14-dev 允许失败（预发布不稳定）
        continue-on-error: ${{ matrix.python == '3.14-dev' }}
        run: pytest -q --tb=short -m "not integration and not benchmark"

  goal-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,http]"
      - name: Goal workflow smoke
        run: pytest -q tests/test_goal_workflow_smoke.py

  # ── 覆盖率（仅在 ubuntu + 3.11 上跑以节省资源）──
  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,http]"

      - name: Test + coverage
        run: pytest --cov=heagent --cov-fail-under=87 -m "not integration and not benchmark"

      - name: Coverage HTML report
        run: coverage html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  # ── Benchmark 性能回归检测 ──
  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,http]"

      - name: Download previous benchmark data
        uses: actions/download-artifact@v4
        with:
          name: benchmark-data
          path: benchmark-data/
        continue-on-error: true

      - name: Run benchmarks
        run: |
          # 基线取最近一次落盘（零填充序号 tail = 最新）；无基线（首次）只落盘不比较。
          # **不加 `--benchmark-only`**：它只跑用了 `benchmark` fixture 的用例，会把「比值型」
          # 性能判据整片跳过（66.2 的提速 >30%、66.5 的冷启动省 >20% 都不用 fixture）——
          # 那样 Epic 66 的 Done when 在 CI 里实际无人执行。`-m benchmark` 已把范围收在性能面。
          BASELINE=$(find benchmark-data -name "*.json" 2>/dev/null | sort | tail -1)
          if [ -n "$BASELINE" ]; then
            pytest --benchmark-autosave --benchmark-storage=./benchmark-data/ \
              --benchmark-compare="$BASELINE" --benchmark-compare-fail=mean:10% -m benchmark
          else
            pytest --benchmark-autosave --benchmark-storage=./benchmark-data/ -m benchmark
          fi

      - name: Upload benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-data
          path: benchmark-data/
          retention-days: 7

      - name: Compare benchmarks
        if: success()
        run: |
          if find benchmark-data -name "*.json" | head -1 | grep -q json; then
            echo "## Benchmark comparison" >> $GITHUB_STEP_SUMMARY
            pytest-benchmark compare --group=group,func $(find benchmark-data -name "*.json") >> $GITHUB_STEP_SUMMARY 2>&1 || true
          else
            echo "No previous benchmark data — skipping comparison" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # ── 供应链安全审查（PR 触发）──
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # ── 集成测试（手动触发或 workflow_dispatch）──
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,http]"

      - name: Integration tests
        run: pytest -q --tb=long -m "integration"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ════════════════════════════════════════════════════════
  # Release — PyPI publish + Docker push (GHCR + Docker Hub)
  # 触发: tag push (v*) 或 workflow_dispatch
  # 前置: lint + test + coverage 全部通过
  # ════════════════════════════════════════════════════════
  release:
    name: Release — PyPI publish & Docker push
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, goal-smoke]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    environment: release  # 强制审批门 (GitHub Environments 保护)
    permissions:
      id-token: write      # PyPI Trusted Publisher OIDC
      contents: read
      packages: write      # GHCR push
      attestations: write  # 可选: 镜像签名

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 提取版本号（优先用 tag，否则从 pyproject.toml 读取）──
      - name: Extract version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep 'version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release version: ${VERSION}"

      # ── 构建 wheel + sdist ──
      - name: Build package
        run: |
          pip install build
          python -m build

      # ── 验证 wheel ──
      - name: Verify wheel
        run: |
          pip install twine
          twine check dist/*

      # ── PyPI publish (Trusted Publisher OIDC，零 secret) ──
      # 注意: 需先在 PyPI 项目设置中配置 Trusted Publisher:
      #   Owner: zsutxz
      #   Repository: HeAgent
      #   Workflow: ci.yml
      #   Environment: release
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # ── Docker setup ──
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GHCR (GitHub Container Registry, 零额外 secret) ──
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Login to Docker Hub ──
      # 前置: 在 GitHub repo Settings → Secrets and variables → Actions
      #   添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN (access token, 非密码)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Docker build + push (multi-arch, GHCR + Docker Hub) ──
      # Dockerfile 使用 ARG 控制 digest 锁定，CI 注入版本号用于 OCI labels
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/heagent:latest
            ghcr.io/${{ github.repository_owner }}/heagent:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/heagent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/heagent:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 失败摘要（R12：发布失败必须留可读痕迹）──
      # PyPI 不接受同版本重传 ⇒ 中途失败时第一要判的是「PyPI 有没有吃下这一版」。
      # 摘要写进 run 页面 + GitHub 自带的工作流失败邮件即通知通道（无外部 webhook secret）。
      - name: Release failure summary
        if: failure()
        run: |
          {
            echo "## Release FAILED — ${VERSION:-unknown}"
            echo ""
            echo "先核两件事再重跑："
            echo "- 该版本号是否已被 PyPI 占用（占用了只能 bump 版本重发，不能重传）；"
            echo "- \`pyproject.toml\` 与 \`src/heagent/__init__.py\` 的版本是否仍一致。"
            echo ""
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
