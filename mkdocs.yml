site_name: HeAgent
site_description: HeAgent —— 单进程异步 Python Agent 运行库的架构与运维文档
# GitHub Pages 的规范地址（canonical 链接 / sitemap 的真源）；不配则部署照常但站点无规范 URL。
site_url: https://zsutxz.github.io/HeAgent/
docs_dir: docs
# 构建产物落临时目录：`docs/` 是真源，`site/` 不入工作树（避免 `git status` 噪声与误提交）。
site_dir: .heagent/tmp/mkdocs-site

# 站点版本与代码版本 = 同一个真源：`src/heagent/__init__.py::__version__`。
# mkdocs 没有模板变量替换，官方机制是配置里的 `!ENV` 标签（`pyyaml_env_tag`，mkdocs 的传递依赖）：
# `scripts/build_docs.py` 在**构建前**导出 `HEAGENT_DOC_VERSION` / `HEAGENT_DOC_COPYRIGHT` 再调 build。
# 裸跑 `mkdocs build --strict`（CI 的 docs 门）时 `!ENV` 回退到下面的默认值 ⇒ 站点照常构建，
# 只是不声明版本——门禁不依赖「谁先导出了变量」这个隐式前提。
extra:
  # 供主题覆盖读取的结构化版本号（内置主题不渲染 extra，故另配 copyright 落到页脚）。
  version: !ENV [HEAGENT_DOC_VERSION, 'dev']
# 内置 mkdocs 主题唯一的页脚槽位，因此版本落成每页页脚的这一行。
copyright: !ENV [HEAGENT_DOC_COPYRIGHT, 'HeAgent 文档']

theme:
  name: mkdocs
  locale: zh

# API 参考由 docstring 自动生成（`mkdocstrings` 的 python handler + `show_submodules`）：
# 每个 `docs/api/<包>.md` 只是 `::: heagent.<包>` 的壳，正文在源码 docstring 里 ⇒ API 文档与代码
# 不存在「两份事实」。mkdocstrings 是**构建期工具**、不进依赖树（与 mkdocs 同档）：
# `pip install mkdocs "mkdocstrings[python]"`，缺它时 `scripts/build_docs.py` 给安装提示。
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # 只渲染公开成员（与 `tests/test_api_docstrings.py` 的「公开 API」口径一致）。
            filters: ["!^_"]
            # 本仓 docstring 是散文式 + 局部 `Args:` 段（mypy 之外唯一的说明面）。
            docstring_style: google
            # 不渲染源码（仓库读者直接看文件；站点读者要的是签名与说明）。
            show_source: false
            # 成员顺序按源码出现顺序，与阅读 `src/heagent/...` 的顺序一致。
            members_order: source
            show_root_heading: true
            show_root_full_path: true

nav:
  - 首页: README.md
  - 架构: framework.md
  - 设计理念: design.md
  - 迭代历程: iteration.md
  - 测试与门禁: testing.md
  - 常见问题: faq.md
  - 错误索引: errors.md
  - 性能调优: performance.md
  - 沙箱机制: sandbox.md
  - API 参考:
      - 索引: api/index.md
      - heagent.agent: api/agent.md
      - heagent.config: api/config.md
      - heagent.context: api/context.md
      - heagent.cron: api/cron.md
      - heagent.engine: api/engine.md
      - heagent.events: api/events.md
      - heagent.memory: api/memory.md
      - heagent.network: api/network.md
      - heagent.providers: api/providers.md
      - heagent.pub: api/pub.md
      - heagent.skills: api/skills.md
      - heagent.tools: api/tools.md
  - 附: claude-updater/latest.md
  - 附: claude-updater/tips/new_features.md

# `--strict` 下 warning 即 error。下面四条 ignore 都是**必需项**而非放水——它们是同一件事的
# 四个面：`docs/` 是**仓库内**文档（按仓库相对路径写作），消费者是仓库读者与 CI 断言
# （`tests/` 里的链接守卫），不是站点访客。mkdocs 只认 `docs_dir` 内的文件与 GitHub 口径之外的
# 锚点算法，四类告警因此必然出现，且都不是文档缺陷。
validation:
  links:
    # ① 绝对路径链接：`docs/README.md` 里有 `/docs/xxx` 形态的仓库内绝对写法。
    absolute_links: ignore
    # ② 无法识别的链接目标（非相对 md 路径，如裸文件名、目录形态）。
    unrecognized_links: ignore
    # ③ `../` 跨目录链接：指向 `docs_dir` 之外（`../AGENTS.md`、`../src/...`、
    #    `../_bmad-output/...`）。Step 04 裁决：不改文档结构、不动 `../` 链接，只配 validation。
    not_found: ignore
    # ④ 锚点口径差异：`docs/framework.md` 的页内 TOC 是**手写**锚点，按 GitHub 的 slug 规则拼
    #    （去 ASCII 与全角标点、空格转 `-`）；mkdocs 走 python-markdown 的 slug 算法，对中文标题
    #    + 反引号 + 括号的处理不同 ⇒ 绝大多数「no such anchor」属于渲染器口径差异。
    #    ⚠ 但这层 ignore 会**连带放过真漂移**：标题里补了后缀（如 `(\`config/\`)` → `(\`config/\` 包)`、
    #    标题追加 `；Epic 56 迁至独立 server`）而 TOC 未同步时，GitHub 上也点不动。
    #    ⇒ 改标题后必须核 TOC 行；排查手法：按 GitHub slug 重算标题锚点与 TOC 逐条比对。
    anchors: ignore
