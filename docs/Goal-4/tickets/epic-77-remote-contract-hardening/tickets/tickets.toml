[[entry]]
id = 1
type = "story"
title = "E77-S01 · 提交幂等键 request_id：同键重发只起一个 run，失败不缓存"
description = "`run` 帧加可选 `request_id`（1–64 字符、不 strip），网络层原样透传给 `ProjectChannelService.start_project_run(project_id, prompt, request_id=…)`；幂等表住入口层适配器（`cli/ws_project_adapter.ProjectChannelAdapter`），语义 = 同一 `(project_id, request_id)` 在 60s 窗口内只调用一次控制台 `start_project_run`：在途时第二个等待者合流到同一个 Future（同一个 `run_id`），已完成时直接回缓存结果。约束：成功才缓存，失败即移除（重试可以重来，与「提交失败不做原子性保证」并存）；无 `request_id` 的帧逐字走旧路径；ack 字段集合不变（四格冻结）。同批把 `ProjectChannelService` docstring 的「无幂等键」口径改写成新的三态语义（无键不覆盖 / 成功可重放 60s / 失败不保证），并同步该文案的判据。"
verify = "`pytest tests/test_ws_project_adapter.py tests/network/test_ws_project_commands.py tests/network/test_ws_protocol.py -q` 全绿，且含四例：① 同 `request_id` 并发两次 ⇒ 控制台 `start_project_run` 调用次数 == 1、两个结果 `run_id` 相同；② 不同 `request_id` ⇒ 2 次；③ 不带 `request_id` ⇒ 2 次（旧路径逐字等价）；④ 首次抛 `HttpRunConflictError` 后同键重试 ⇒ 控制台被再次调用（失败未缓存）；`pytest tests/network -q` 零回归。"
covers = ["R1"]
after = []
risk = "medium"
hitl = false
parallel_group = "e77"
write_set = [
  "src/heagent/network/ws_protocol.py",
  "src/heagent/network/ws_commands.py",
  "src/heagent/cli/ws_project_adapter.py",
  "tests/network/test_ws_protocol.py",
  "tests/network/test_ws_project_commands.py",
  "tests/network/test_ws_project_submit.py",
  "tests/test_ws_project_adapter.py",
]

