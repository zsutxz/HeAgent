[[entry]]
id = 1
type = "story"
title = "E75-S01 · 注册表健康探针与项目错误码"
description = "`pub/projects.py` 新增 `ProjectRegistryHealth`（`code: ok|unreadable` + 一句 `detail`）与 `ProjectRegistry.health()`：纯读、不写盘，复用一次私有读径，把 `OSError` / `UnicodeError` / `_RegistryCorrupt` 一律映射为 `unreadable`；每次判定不可读只打 1 条 WARNING（不随请求数刷屏）；`load()` / `find()` / `list()` 的 fail-soft 语义逐字不变。`network/http_protocol.py::HttpErrorCode` 新增 `PROJECT_REGISTRY_UNREADABLE = \"project_registry_unreadable\"`（其余项目侧错误码实测已存在，复用不重复定义）。契约基线同批重生成并人工 review diff。"
verify = "`pytest tests/test_project_registry_health.py -q` 五例：正常文件 `health().code == \"ok\"`；坏 JSON / BOM / 超 32 条 / 目录不可读四例 `health().code == \"unreadable\"`、`list()` 仍回 default 一条、`caplog` 恰 1 条 WARNING。`python scripts/contract_snapshot.py --write` 后 `git diff tests/fixtures/contract_baselines/transport_errors.json` 只多该 code 条目、无其他字段漂移。"
covers = ["R5", "R7"]
after = ["epic-74-ws-frame-contract"]
risk = "medium"
hitl = false
parallel_group = "P1"
write_set = [
  "src/heagent/pub/projects.py",
  "src/heagent/network/http_protocol.py",
  "tests/test_project_registry_health.py",
  "tests/fixtures/contract_baselines/transport_errors.json",
]

[[entry]]
id = 2
type = "story"
title = "E75-S02 · network 侧项目通道端口与 project_id 提交分支"
description = "`network/ws_server.py` 的 `_submit_run` 新增 `project_id` 分支（`ProjectChannelService` Protocol 与 `SubmittedRun` 已由 74.1 定义，本 entry 只接线与加判据）：先 `await project_service.ensure_available(...)` 再 `await project_service.start_project_run(...)`，成功回 ack；`HttpRunConflictError.code` 逐字透传、连接不断；`project_service is None` 时 `run`（带 id）/ `projects` / `cancel_run` 回 `invalid_request`，不静默按 default 处理；缺省 `project_id` 路径（`service.start_run(prompt)`）逐字不动。`project_service` 的实现方（适配器）与装配不在本 entry。"
verify = "`pytest tests/network -q -k \"ws_project_submit or ws_server\"` 含：`inspect.signature` 参数名集合断言（I5）；无 `project_id` ⇒ console 0 次 / `start_run` 1 次（I6）；带 `project_id` ⇒ console 1 次且 `ProjectRunRequest.session_id is None`（I9）；`project_service=None` 三命令回 `invalid_request` 且连接不断；`HttpRunConflictError(code=\"project_busy\")` 原样出现在错误帧。`grep -rn \"is_dir\" src/heagent/network/` 与运行栈/配置 import grep 均 0 命中；`pytest tests/test_architecture_contracts.py -q` 绿。"
covers = ["R6", "R7"]
after = ["epic-74-ws-frame-contract"]
risk = "high"
hitl = false
parallel_group = "P1"
write_set = [
  "src/heagent/network/ws_server.py",
  "tests/network/test_ws_project_submit.py",
]

[[entry]]
