type = "story"
title = "E75-S03 · cli/ws_project_adapter.py 帧转译单源"
description = "新增 `src/heagent/cli/ws_project_adapter.py::ProjectChannelAdapter`（≤150 行，只翻译不含判据）：`__init__(console, registry_health)`；`list_projects()` 把 `ProjectListResponse` 投影为 `WsProjectsFrame`，每条 `ProjectChannelEntry` 恰三字段 `id` / `name` / `available`（丢弃 `path` / `last_opened_at` / `is_default`），顺序沿用注册表 `list()`，`registry_state` 取 `registry_health()`；`start_project_run(project_id, prompt)` 唯一动作是 `await console.start_project_run(project_id, ProjectRunRequest(prompt=prompt))` 并收窄为 `SubmittedRun(run_id, status)`（丢 `session_id`），`ConsoleOperationError.code` / `ProjectRegistryError.code` 原样包成 `HttpRunConflictError`；`ensure_available(project_id)` 成功返回原 id。文件内不出现 `Path` / `os` / `is_dir` / 注册表方法调用。同批改 `tests/test_architecture_contracts.py` 的 cli 布局白名单与 `docs/frame.md` 的 cli 子模块表与目录树。"
verify = "`pytest tests/test_ws_project_adapter.py -q`：entry 序列化键集 == `{id,name,available}` 且 `\"path\"` 计数 0；`SubmittedRun.model_fields` 不含 `session_id`；`ConsoleOperationError(code=\"project_busy\")` 与 `ProjectRegistryError(code=\"project_registry_unreadable\")` 抛出后 `HttpRunConflictError.code` 逐字相同；`registry_health()` 回 `\"unreadable\"` ⇒ 帧 `registry_state == \"unreadable\"`。`pytest tests/test_architecture_contracts.py -q` 转绿（白名单已补）；`mkdocs build --strict` 0 warning。"
covers = ["R1", "R2", "R7"]
after = [2]
risk = "medium"
hitl = false
parallel_group = "P2"
write_set = [
  "src/heagent/cli/ws_project_adapter.py",
  "tests/test_architecture_contracts.py",
  "docs/frame.md",
  "tests/test_ws_project_adapter.py",
]

[[entry]]
id = 4
type = "story"
title = "E75-S04 · 控制台编排：六项落点与会话续接/新建"
description = "`cli/http_console.py::HttpProjectConsole.start_project_run` 把会话选择写成两条显式分支：该项目有历史会话 ⇒ 续最近一次；从未有会话 ⇒ 新建（可断言的分支，不是「查不到即异常」）。六项落点全部锚定项目根：`context.workspace_root`、会话文件、产物目录、`ExecutionLedger` 行、`RunContext.state_root`（工具审计根）、memory 根；启动工作区根零新增产物、零新增 ledger 条目。`available=false` 的项目提交抛 `ConsoleOperationError(code=\"project_unavailable\")`，不建 run、不占名额。返回仍为 `ProjectRunResponse`（收窄在适配器）。"
verify = "`pytest tests/test_http_console_project_run.py -q`：单项目与两项目各一例，六项落点断言全绿且启动工作区根无新增；「有历史会话 ⇒ 续最近」断言 session_id 复用，「从未有会话 ⇒ 新建」断言 session_id 新生成；`available=false` 例断言抛 `project_unavailable` 且无 run 落盘、无 ledger 条目。既有 HTTP 项目链用例（`pytest tests -q -k http_console`）全绿（NG12 不改写既有语义）。"
covers = ["R3", "R4"]
after = [1, "epic-74-ws-frame-contract"]
risk = "high"
hitl = false
parallel_group = "P2"
write_set = [
  "src/heagent/cli/http_console.py",
  "tests/test_http_console_project_run.py",
]

