title = "E79-S01 · `scripts/ws_tls_attest.py`：A76 服务端侧的四段承兑"
description = "新增 `scripts/ws_tls_attest.py`（stdlib only）：① 绑定面（`host:port` 可连 + 指定地址必须 REFUSED，默认在被测地址非回环时加 `127.0.0.1:<port>`）② TLS 握手（版本 / 套件 / 对端叶证书，不校链不校主机名）③ pin 对账（对端 SPKI-SHA256 == `--cert`，打印三格式）④ 认证闸门（无 token 期望 `403`，给 `--token` 追加验 `101`），可选第 ⑤ 段 `--status-url` 比对 `/api/status` 的 `tls.spki_sha256`。退出码 0/1/2 契约；`--self-check` 进程内起 TLS stub 离线自证；token 只在请求头出现、任何输出行都不带值。同批补 `tests/test_ws_tls_attest_script.py`。"
verify = "`pytest tests/test_ws_tls_attest_script.py -q` 全绿（自检 exit 0 / `--serve-cert` 指向别的证书判 `1` 且输出含 `pin 漂移` / 材料缺失 exit 2 且点名 `heagent tls init` / 目标未监听 exit 2 且含 `未在监听` / `--help` / token 静态断言 / `[::1]:9201` 脱括号）；`python scripts/ws_tls_attest.py --self-check --cert tests/fixtures/ws_tls/cert.pem --key tests/fixtures/ws_tls/key.pem` exit 0。"
covers = ["R1"]
