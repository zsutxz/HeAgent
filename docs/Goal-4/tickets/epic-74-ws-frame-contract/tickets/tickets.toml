verify = "`pytest tests/network/test_ws_project_submit.py -q`：无 `project_id` 的提交断言 `HttpProjectConsole.start_project_run` 0 次且 `HttpRunService.start_run` 1 次；带 `project_id` 的提交断言调用序列为 `ensure_available` → `start_project_run` 各 1 次、`SubmittedRun` 无 `session_id`；`ensure_available` 抛 `unknown_project` 时错误帧 code 为该字面值且 `start_run` / `start_project_run` 调用次数均 0；`inspect.signature` 断言 `ProjectChannelService` 两个方法的参数名集合恰为 `{project_id, prompt}` 与 `{project_id}`。"
