[[entry]]
id = 3
type = "story"
title = "E74-S03 · cancel_run 帧与只读口径"
description = "完成时 `WsCommand` 含 `CANCEL_RUN = \"cancel_run\"`、`WsCommandFrame` 含必带 `run_id`（min_length=1 / max_length=64）并登记进 `_FRAME_FIELDS`，`cancel_run` 带 `project_id` 或缺 `run_id` 判 `malformed`；集合级端点按 `run_id` 取消并复用既有 `service.cancel_run(run_id)`（不新建第二条取消实现），目标已终止时回终态 `WsAckFrame`、目标不存在回 `unknown_run`，两者都不断连；单 run 端点上 `run_id` 必须等于该连接绑定的 run 否则 `invalid_request` 不断连；`readonly=True` 的 listener 上 `cancel_run` 回 `invalid_request` 且不断连。"
verify = "`pytest tests/network/test_ws_cancel_run.py tests/network/test_ws_protocol.py -q`：`cancel_run` 目标 run 到终态、同连接的另一个 run 仍活且未被取消；`readonly=True` 回 `invalid_request` 且连接未被关闭；`run_id` ≠ 绑定 run ⇒ `invalid_request`；已终止 run ⇒ ack 携带终态 status；未知 `run_id` ⇒ `unknown_run` 且不断连；帧面四例（缺 `run_id`、带 `project_id`、未知键、超 `WS_MAX_COMMAND_CHARS`）均按既有口径判 `malformed` / `too_large`。"
covers = ["R5"]
after = [1]
risk = "medium"
hitl = false
write_set = [
  "src/heagent/network/ws_protocol.py",
  "src/heagent/network/ws_server.py",
  "tests/network/test_ws_cancel_run.py",
  "tests/network/test_ws_protocol.py",
]

