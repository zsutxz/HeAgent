[[entry]]
id = 1
type = "story"
title = "E78-S01 · 幂等窗口可观测：容量淘汰与键移出各一条 debug 日志"
description = "给 `cli/ws_submission_cache.py` 加 logger 与两条 DEBUG 事件：`ws event=idempotency_evicted reason=capacity`（容量淘汰最旧一条时）与 `ws event=idempotency_dropped reason=failed|cancelled`（失败/取消移出窗口时，`drop(key, reason=…)` 新增关键字参数）。日志只含 `project_id` 与 reason（+ 淘汰时 `entries` 计数），**不含 `request_id`**（客户端不透明键，与「ack 不回显、不落 `x-request-id`」同一立场）；TTL 过期清理**不打日志**。同批改适配器两处调用传 reason，`docs/framework.md` 模块表行补事件名。"
verify = "`pytest tests/test_ws_submission_cache.py tests/test_ws_project_adapter.py -q` 全绿，且含三例新断言：① 容量淘汰恰一条 `idempotency_evicted` 且带正确 `project_id`/`reason=capacity`；② 失败移出记 `reason=failed`、owner 取消记 `reason=cancelled`；③ 全量日志里不出现 `request_id`，TTL 过期清理零条事件。"
covers = ["R1"]
after = []
risk = "low"
hitl = false
