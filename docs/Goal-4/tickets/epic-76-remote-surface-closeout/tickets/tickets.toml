[[entry]]
id = 1
type = "story"
title = "E76-S01 · 断连续流三判据：无空洞 / 窗口不足必须 resync_required / 重复可见可去重"
description = "在 `tests/network/test_ws_resume.py` 用 fake `RunWebSocketService`（不跑真 run）把 AD-5 的三条事实落成可跑断言：① 无空洞 —— 连收 N 帧后断开，用第 N 帧的事件 id 作 `last_event_id` 重连，续到的首帧 id ≤ N+1 且其后连续递增至终态；② 窗口不足必须响 —— ring buffer 置 1、cursor 落后 ≥2，收到 `resync_required` 错误帧且没有任何 event 帧先于它发出；③ 重复可见可去重 —— 重放窗口重叠时按 id 去重后条数 == 服务端事件总数。同批补「run 已清理」路径：取消后仍可续读到尾部，run 记录已不存在则回具名错误帧（`unknown_run`）、不静默空流。取证在前：先跑一遍确认既有订阅实现对「run 已不存在」是具名错误还是空流，仅当是空流才做最小修复。"
verify = "`pytest tests/network/test_ws_resume.py -q` 三例全绿（含「无 event 帧先于 resync_required」的顺序断言）+ run 已清理路径一例；`pytest tests/network -q` 既有续流与端点用例零回归；`git diff --stat src/heagent/network/ws_server.py` 只含「run 已不存在 ⇒ 具名错误」相关行（取证若显示已是具名错误则该文件 0 行 diff）。"
covers = ["R3", "R4"]
after = []
risk = "medium"
hitl = false
parallel_group = "e76-a"
write_set = [
  "tests/network/test_ws_resume.py",
  "src/heagent/network/ws_server.py",
]

