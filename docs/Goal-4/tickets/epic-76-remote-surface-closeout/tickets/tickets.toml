type = "story"
title = "E76-S05 · ADR-005 五步验收串跑：列项目 → 两项目各 1 run → 事件流完整 → 取消其一 → cursor 续流"
description = "新增 `tests/network/test_ws_remote_flow.py`，把 ADR-005 验收基线一次跑通到底，复用 S01/S02 的 fake 服务与夹具，不引入真 provider、不跳过任一步、不以人工确认替代：① `projects` 帧列出 A/B（各含 `id`/`name`/`available` 三键）；② 两条集合级连接各为 A、B 提交 1 run，ack 各指向本次 run；③ A、B 事件流各自完整到终态且 `run_id` 交叉计数 == 0；④ 取消 A ⇒ A 到取消终态而 B 仍活到自终态；⑤ B 中途断开后凭最后事件 id 续流，首帧 ≤ N+1 且此后无空洞到终态。若串跑暴露缺陷，回到对应判据 story 的最小修复范围修，不在此 entry 扩写生产代码。"
verify = "`pytest tests/network/test_ws_remote_flow.py -q` 单例全绿，五步在同一条用例内顺序断言（任一步失败即整体红）；用例内显式断言「`run_id` 交叉计数 == 0」「取消 A 后 B 仍产出事件」「续流首帧 id ≤ last_event_id + 1」；`git diff --stat src/` 对本 entry 为空（纯测试增量）。"
covers = ["R1", "R3", "R4"]
